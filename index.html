<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Наши хотелки</title>
<meta name="theme-color" content="#fff4f4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23c2185b' d='M16 28s-11-7-11-15a6 6 0 0 1 11-3.3A6 6 0 0 1 27 13c0 8-11 15-11 15z'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Хотелки">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">
<style>

:root{
  --bg:#fff4f4; --fg:#3a1420; --muted:#8a5a66; --line:#f3d6dc; --card:#ffffff; --soft:#fde3e7;
  --accent:#c2185b; --accent2:#e0567a; --on-accent:#ffffff; --ok:#2e7d5b; --danger:#c62828;
  --shadow:0 2px 10px rgba(194,24,91,.08); --overlay:rgba(58,20,32,.35);
  --font:"Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{--bg:#22141a;--fg:#fbe9ee;--muted:#c79aa7;--line:#43262f;--card:#2d1a21;--soft:#3d2029;--accent:#ff5c95;--accent2:#ff8aab;--on-accent:#22141a;--ok:#6fd3a3;--danger:#ff8a80;--shadow:none;--overlay:rgba(0,0,0,.55);color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.45;min-height:100vh;padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.logo{font-weight:900;font-size:22px;color:var(--accent);letter-spacing:-.01em;white-space:nowrap}
.bar-actions{display:flex;gap:6px;align-items:center}
.icon-btn{border:1px solid var(--line);background:var(--card);border-radius:999px;height:38px;min-width:38px;padding:0 12px;font-weight:800;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;position:relative}
.badge{position:absolute;top:-4px;right:-4px;background:var(--accent);color:var(--on-accent);border-radius:999px;font-size:11px;font-weight:900;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px}

main.wrap{display:flex;flex-direction:column;gap:16px;padding-block:16px 96px}

.people{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 6px;scrollbar-width:none}
.people::-webkit-scrollbar{display:none}
.person{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px 6px 6px;display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;box-shadow:var(--shadow)}
.person.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:900;flex:none;color:#fff}
.person.add{padding:6px 14px;color:var(--accent);border-style:dashed;box-shadow:none}

.ctrl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);padding:8px 14px;border-radius:999px;background:var(--card);font-weight:700;font-size:14px}
.tab.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.budget{display:flex;align-items:center;gap:10px;font-size:14px}
.budget label{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:700}
.budget input{width:96px;font:inherit;font-size:16px;font-weight:800;color:var(--accent);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-variant-numeric:tabular-nums}
.budget input:focus{outline:2px solid var(--accent2);outline-offset:1px}

.head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.head h1{margin:0;font-size:22px;font-weight:900;text-wrap:balance}
.head span{color:var(--muted);font-size:14px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
@media (max-width:480px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{background:var(--card);border-radius:18px;padding:8px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0;text-align:left}
.card .open{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:6px;border-radius:12px}
.card .open:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
.ph{aspect-ratio:1;width:100%;border-radius:12px;display:grid;place-items:center;color:var(--accent);font-size:34px;font-weight:900;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--soft),var(--bg))}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.imp{position:absolute;left:8px;top:8px;background:var(--card);color:var(--accent);font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.lock{position:absolute;right:8px;top:8px;background:var(--card);color:var(--muted);font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px}
.t{font-weight:800;font-size:15px;line-height:1.25;padding:2px 4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;word-break:break-word}
.d{font-size:12px;color:var(--muted);padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.4em}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:2px 4px;margin-top:auto}
.price{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.done-btn{border:0;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:800;background:var(--soft);color:var(--accent);white-space:nowrap}
.card.done .ph{opacity:.45}
.card.done .t{text-decoration:line-through;color:var(--muted)}
.card.done .done-btn{background:var(--accent);color:var(--on-accent)}
.add-card{border:2px dashed var(--line);background:transparent;border-radius:18px;color:var(--muted);font-weight:800;font-size:15px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.add-card big{font-size:38px;line-height:1;color:var(--accent2)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:28px 8px;display:flex;flex-direction:column;gap:6px;align-items:center}
.empty b{color:var(--fg);font-size:16px}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;width:58px;height:58px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);font-size:32px;font-weight:700;box-shadow:0 6px 18px rgba(194,24,91,.35);display:none}
@media (max-width:640px){.fab{display:grid;place-items:center}.add-card{display:none}}
@media (prefers-reduced-motion:no-preference){.card{transition:transform .15s}.card:hover{transform:translateY(-2px)}}

.auth{min-height:100vh;display:grid;place-items:center;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.auth-box{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.auth-box .logo{font-size:30px;text-align:center}
.auth-box p{margin:0;color:var(--muted);text-align:center}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;padding:8px;border-radius:10px;font-weight:800;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.08)}

.field{display:flex;flex-direction:column;gap:5px}
.field label,.lbl{font-weight:800;font-size:13px}
.field small{color:var(--muted);font-size:12px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=url],textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{min-height:72px;resize:vertical}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;font-size:15px;background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:var(--soft);color:var(--accent)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--danger);font-size:13px;font-weight:700}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}

.overlay{position:fixed;inset:0;background:var(--overlay);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--card);width:100%;max-width:520px;max-height:min(92vh,860px);overflow:auto;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
@media (max-width:560px){.overlay{align-items:flex-end;padding:0}.sheet{border-radius:22px 22px 0 0;max-height:92vh;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{margin:0;font-size:20px;font-weight:900}
.x{border:0;background:var(--soft);border-radius:50%;width:34px;height:34px;font-size:18px;font-weight:800;color:var(--accent);flex:none}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick .ph{width:96px;height:96px;flex:none;font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
.detail-photo{width:100%;aspect-ratio:4/3;border-radius:16px;object-fit:cover;background:var(--soft)}
.meta{display:flex;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted)}
.meta b{color:var(--fg)}
.desc{white-space:pre-wrap;word-break:break-word;margin:0}
.code-box{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:14px;padding:12px 14px;flex-wrap:wrap}
.code-box b{font-size:22px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.li .who{display:flex;align-items:center;gap:10px;font-weight:800;min-width:0}
.li .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .btns{display:flex;gap:6px;flex:none}
.small{padding:7px 10px;font-size:13px;border-radius:10px}
.check{display:flex;align-items:center;gap:8px;font-weight:700}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.install-hint{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 14px;font-weight:700;font-size:14px}
.install-hint span{flex:1}
.install-hint .x{flex:none;background:var(--card)}
.how{background:var(--soft);border-radius:16px;padding:12px 16px}
.how h3{margin:0 0 6px;font-size:16px}
.how ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.how .warn{margin:0 0 8px;color:var(--danger);font-weight:700}
.sheet .ok{margin:0;color:var(--ok);font-weight:800}
.link-row{display:flex;gap:8px}
.link-row input{flex:1;min-width:0}
.link-row .btn{flex:none;white-space:nowrap}
#wf-ph img,.detail-photo{cursor:zoom-in}
.lightbox{position:fixed;inset:0;z-index:80;background:rgba(20,6,12,.92);display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.lightbox .x{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;background:rgba(255,255,255,.9)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;max-width:calc(100vw - 32px);text-align:center}
.tour-dots{display:flex;gap:6px;justify-content:center}
.tour-dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.tour-dots i.on{background:var(--accent)}
.tour-big{font-size:44px;text-align:center;line-height:1}
.loading{padding:60px 0;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="app"><div class="loading">Загружаю…</div></div>
<script src="supabase.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
